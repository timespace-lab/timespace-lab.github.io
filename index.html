<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="시공간 LAB · 학생이 시간과 공간을 연결해 지도와 연표로 탐구 기록을 만드는 웹앱">
<title>시공간 LAB</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/maplibre-gl/5.2.0/maplibre-gl.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
<style>
/* 관측실 × 현대 아틀라스: 아이보리 작업면 + 딥 잉크 셸. 틸 = 공간(장소·경로·공간 좌표), 브라스 = 시간(눈금·날짜·시간 좌표). 선택은 딥 잉크 */
:root {
  --ivory: #F4F0E7;
  --ivory-2: #ECE6D8;
  --ivory-3: #DFD7C4;
  --paper: #FBF9F4;
  --ink: #14232D;
  --ink-2: #44535C;
  --ink-3: #5B676D;
  --ink-plate: #182A35;
  --ink-line: #2C4452;
  --on-ink: #F4F0E7;
  --on-ink-2: #A9B9C0;
  --teal: #548C88;
  --teal-ink: #36665F;
  --teal-wash: #DCE8E4;
  --brass: #B6975A;
  --brass-ink: #7A6232;
  --brass-wash: #F0E6CF;
  --rule: #D6CEBB;
  --danger: #9C3A29;
  --danger-wash: #F3DDD5;
  --sea: #DCE3DF;
  --land: #F8F5EE;
  --coast: #9E9682;
  --grat: #C8D1CC;
  --font: "Noto Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
  --gut: max(16px, env(safe-area-inset-left, 0px));
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--ivory); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; caret-color: var(--teal); font-variant-numeric: tabular-nums; }
::selection { background: var(--brass-wash); color: var(--ink); }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; padding: 0; text-align: inherit; }
:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
* { scrollbar-width: thin; scrollbar-color: var(--ivory-3) transparent; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.sm { width: 15px; height: 15px; }
#root { height: 100%; }
img.ph { display: block; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.04); background: var(--ivory-3); }
img.ph.user { filter: none; }

/* 버튼 */
.btn { display: inline-flex; align-items: center; gap: 7px; height: 36px; padding: 0 14px; border-radius: 4px; background: var(--ivory-2); color: var(--ink); font-weight: 500; white-space: nowrap; transition: background .15s; }
.btn:hover { background: var(--ivory-3); }
.btn.ink { background: var(--ink); color: var(--on-ink); }
.btn.ink:hover { background: #22394A; }
.btn.teal { background: var(--teal); color: #fff; }
.btn.danger { background: var(--danger); color: #fff; }
.btn.ghost { background: transparent; }
.btn.ghost:hover { background: var(--ivory-2); }
.btn.big { height: 50px; padding: 0 22px; font-size: 16px; }
.btn.on { background: var(--ink); color: var(--on-ink); }
.btn.lite { background: var(--ivory); color: var(--ink); }
.btn.out-ink { background: transparent; color: var(--on-ink); box-shadow: inset 0 0 0 1px var(--ink-line); }
.btn.out-ink:hover { background: var(--ink-plate); }
.seg { display: inline-flex; background: var(--ivory-2); border-radius: 4px; padding: 3px; gap: 2px; }
.seg button { height: 30px; padding: 0 11px; border-radius: 3px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.seg button.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(20,35,45,.14); }
.seg button[aria-disabled="true"] { color: var(--ink-3); opacity: .6; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 4px; height: 22px; padding: 0 8px; border-radius: 3px; background: var(--ivory-2); font-size: 12px; font-weight: 500; color: var(--ink-2); }
.chip.bc { background: var(--ink); color: var(--on-ink); }

/* 앱 셸 */
.app { display: grid; grid-template-columns: 76px minmax(0, 1fr); height: 100%; }
.rail { background: var(--ink); color: var(--on-ink); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 6px; }
.rail .mark { margin-bottom: 14px; }
.rail button.nav { width: 64px; display: grid; justify-items: center; gap: 3px; padding: 9px 0 7px; border-radius: 6px; color: var(--on-ink-2); font-size: 11px; font-weight: 500; }
.rail button.nav:hover { color: var(--on-ink); background: var(--ink-plate); }
.rail button.nav.on { color: var(--on-ink); background: var(--ink-line); }
.rail .me { margin-top: auto; width: 34px; height: 34px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.ed-wrap { display: flex; flex-direction: column; height: 100%; min-width: 0; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 0 16px; height: 58px; background: var(--paper); flex: none; box-shadow: inset 0 -1px 0 var(--rule); }
.topbar .back { display: inline-flex; align-items: center; gap: 2px; color: var(--ink-2); font-size: 13px; }
.topbar h1 { font-size: 17px; font-weight: 700; margin: 0; white-space: nowrap; }
.topbar .sp { flex: 1; }
.save { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.save.failed { color: var(--danger); font-weight: 700; }
.save.saving svg { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.banner { display: flex; align-items: center; gap: 10px; padding: 9px 16px; background: var(--danger-wash); color: var(--danger); font-size: 13px; font-weight: 500; flex: none; }
.banner .btn { height: 28px; font-size: 12px; margin-left: auto; }
.ed { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) 330px; min-height: 0; }
.ed-main { display: grid; grid-template-rows: minmax(240px, 1fr) auto; min-width: 0; min-height: 0; box-shadow: inset -1px 0 0 var(--rule); }

/* 지도 (아틀라스) */
.map-area { position: relative; background: var(--sea); min-height: 0; overflow: hidden; }
.mapbox { position: absolute; inset: 0; }
.mapbox svg { display: block; width: 100%; height: 100%; }
.map-area.picking svg { cursor: crosshair; }
.legend { position: absolute; left: 14px; top: 14px; background: rgba(251,249,244,.95); border-radius: 4px; padding: 10px 12px; display: grid; gap: 6px; font-size: 12px; color: var(--ink-2); box-shadow: 0 1px 2px rgba(20,35,45,.12); }
.legend b { font-size: 12px; color: var(--ink); }
.legend div { display: flex; align-items: center; gap: 8px; }
.lg { width: 14px; height: 14px; border-radius: 50%; flex: none; background: var(--paper); border: 3px solid var(--teal); }
.lg.x { box-shadow: 0 0 0 2px var(--paper), 0 0 0 3.5px var(--ink); width: 12px; height: 12px; }
.lg.h { border: 2px dashed var(--brass); }
.lg.sel { background: var(--ink); border-color: var(--teal); }
.lg-ln { width: 22px; height: 4px; border-radius: 2px; background: var(--teal); flex: none; }
.atlas-foot { position: absolute; left: 14px; bottom: 12px; display: flex; align-items: flex-end; gap: 16px; font-size: 11px; color: var(--ink-2); }
.scalebar { display: grid; gap: 3px; }
.scalebar .bar { height: 6px; display: flex; box-shadow: inset 0 0 0 1px var(--ink); }
.scalebar .bar i { flex: 1; background: var(--ink); }
.scalebar .bar i + i { background: var(--paper); }
.scalebar .lab { display: flex; justify-content: space-between; }
.north { display: grid; justify-items: center; gap: 1px; font-weight: 700; color: var(--ink); }
.readout { position: absolute; right: 14px; bottom: 12px; background: rgba(251,249,244,.95); border-radius: 4px; padding: 6px 10px; font-size: 12px; color: var(--ink-2); display: flex; gap: 10px; box-shadow: 0 1px 2px rgba(20,35,45,.12); }
.readout b { color: var(--teal-ink); font-weight: 700; }
.zoom { position: absolute; right: 14px; top: 14px; display: grid; gap: 4px; }
.zoom button { width: 34px; height: 34px; border-radius: 4px; background: var(--paper); display: grid; place-items: center; box-shadow: 0 1px 3px rgba(20,35,45,.14); }
.map-hint { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--ink); color: var(--on-ink); padding: 8px 14px; border-radius: 4px; font-size: 13px; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.map-empty { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
.map-empty div { background: rgba(251,249,244,.95); border-radius: 4px; padding: 16px 22px; text-align: center; color: var(--ink-2); }
.announce { position: absolute; left: 50%; transform: translateX(-50%); top: 14px; display: flex; border-radius: 4px; overflow: hidden; box-shadow: 0 6px 18px rgba(20,35,45,.18); max-width: calc(100% - 120px); }
.announce .now { background: var(--ink); color: var(--on-ink); padding: 9px 16px; display: grid; }
.announce small { font-size: 11px; color: var(--on-ink-2); }
.announce .now b { font-size: 17px; }
.announce .next { background: var(--paper); padding: 9px 16px; display: grid; }
.announce .next small { color: var(--ink-3); }
.playbar { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; background: var(--paper); border-radius: 6px; padding: 6px; box-shadow: 0 6px 18px rgba(20,35,45,.16); }
.playbar .count { padding: 0 10px; font-weight: 700; }

/* 시간축 (박물관 전시) */
.axis-area { background: var(--paper); box-shadow: inset 0 1px 0 var(--rule); display: grid; grid-template-rows: auto auto; min-width: 0; }
.axis-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px 2px; flex-wrap: wrap; }
.axis-head h2 { font-size: 14px; margin: 0; font-weight: 700; }
.axis-head .meta { font-size: 12px; color: var(--ink-3); }
.axis-head .sp { flex: 1; }
.axis-scroll { overflow-x: auto; overflow-y: hidden; padding-bottom: 6px; }
.axis-track { position: relative; }
.ax-line { position: absolute; height: 2px; background: var(--brass); }
.ax-line.dim { background: var(--ivory-3); }
.ax-tick { position: absolute; width: 1px; background: var(--brass); }
.ax-yr { position: absolute; font-size: 20px; font-weight: 900; letter-spacing: -0.02em; color: var(--ink); line-height: 1; }
.ax-mo { position: absolute; font-size: 10.5px; color: var(--brass-ink); transform: translateX(-50%); }
.mk { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--paper); border: 3px solid var(--brass); z-index: 3; transition: transform .15s ease-out; }
.mk:hover { transform: scale(1.2); }
.mk.hollow { border-style: dashed; border-width: 2px; }
.mk.sel { background: var(--ink); border-color: var(--brass); transform: scale(1.25); }
.mk.dim { opacity: .35; }
.leader { position: absolute; width: 1px; background: var(--ivory-3); z-index: 1; }
.leader.sel { background: var(--ink); width: 2px; }
.box { position: absolute; width: 184px; height: 46px; border-radius: 4px; background: var(--paper); box-shadow: 0 0 0 1px var(--rule); display: flex; overflow: hidden; z-index: 2; text-align: left; transition: box-shadow .15s; }
.box:hover { box-shadow: 0 0 0 1px var(--ink-3), 0 4px 10px rgba(20,35,45,.08); }
.box .th { width: 46px; flex: none; }
.box .tx { padding: 4px 9px; display: grid; align-content: center; min-width: 0; }
.box .tx span { font-size: 11px; color: var(--brass-ink); font-weight: 500; }
.box .tx b { font-size: 13px; font-weight: 700; line-height: 1.25; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.box.sel { background: var(--ink); color: var(--on-ink); box-shadow: none; }
.box.sel .tx span { color: var(--brass); }
.box.dim { opacity: .35; }
.box.hl { box-shadow: 0 0 0 2px var(--teal); }
.redact { display: inline-block; background: var(--ink); width: 7.5em; height: 1em; vertical-align: -2px; border-radius: 1px; }
.box.sel .redact { background: var(--on-ink-2); }
.rel-tag { position: absolute; transform: translate(-50%, -50%); background: var(--paper); color: var(--ink); box-shadow: 0 0 0 1px var(--ink); font-size: 10.5px; font-weight: 700; padding: 0 6px; border-radius: 2px; white-space: nowrap; z-index: 4; }
.axis-empty { margin: 12px 16px 16px; border-radius: 4px; padding: 20px; display: flex; align-items: center; gap: 18px; color: var(--ink-2); background: var(--ivory); }
.axis-empty .ghost { flex: 1; height: 0; border-top: 2px dashed var(--brass); opacity: .6; }

/* 오른쪽 패널 */
.insp { background: var(--paper); overflow-y: auto; min-height: 0; }
.ip { padding: 18px; display: grid; gap: 16px; align-content: start; }
.ip-k { font-size: 12px; font-weight: 700; color: var(--ink-3); display: flex; align-items: center; gap: 6px; }
.ip h3 { font-size: 22px; line-height: 1.3; margin: 0; font-weight: 700; letter-spacing: -0.015em; }
.ip p { margin: 0; }
.muted { color: var(--ink-3); font-size: 13px; }
.ip hr { border: 0; height: 1px; background: var(--rule); margin: 0; }
.coords { display: grid; grid-template-columns: 1fr 1fr; gap: 2px; border-radius: 4px; overflow: hidden; }
.coords > div { background: var(--ivory); padding: 9px 11px; display: grid; gap: 1px; }
.coords .k { font-size: 11px; font-weight: 700; }
.coords .t .k { color: var(--brass-ink); }
.coords .s .k { color: var(--teal-ink); }
.coords b { font-size: 14px; font-weight: 700; }
.coords small { font-size: 11px; color: var(--ink-3); }
.coords .s.none { background: var(--brass-wash); }
.photo-big { margin: 0; border-radius: 4px; overflow: hidden; background: var(--ivory); }
.photo-big .frame { aspect-ratio: 16 / 9; }
.photo-big figcaption { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 10px; font-size: 11.5px; color: var(--ink-3); }
.drop { border: 1.5px dashed var(--rule); border-radius: 4px; padding: 16px; display: grid; justify-items: center; gap: 4px; text-align: center; color: var(--ink-2); font-size: 13px; cursor: pointer; }
.drop:hover { border-color: var(--teal); background: var(--teal-wash); }
.drop small { color: var(--ink-3); font-size: 12px; }
.memo { background: var(--brass-wash); border-radius: 4px; padding: 9px 12px; font-size: 13px; }
.rel-list { display: grid; gap: 4px; }
.rel-row { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 7px 10px; border-radius: 4px; background: var(--ivory); text-align: left; width: 100%; }
.rel-row:hover { background: var(--ivory-2); }
.rel-row .k { font-size: 11px; font-weight: 700; color: var(--ink-3); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.field { display: grid; gap: 5px; }
.field > label, .field > .lb { font-size: 12px; font-weight: 700; color: var(--ink-2); }
.inp { height: 38px; border: 1px solid var(--rule); border-radius: 4px; background: #fff; padding: 0 11px; width: 100%; }
.inp:focus { outline: 2px solid var(--teal); outline-offset: -1px; border-color: var(--teal); }
textarea.inp { height: 72px; padding: 9px 11px; resize: vertical; }
.inp::placeholder { color: var(--ink-3); }
.date-row { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--ink-2); }
.date-row .inp { width: 72px; } .date-row .inp.s { width: 50px; }
.check { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink-2); }
.check input { accent-color: var(--teal); width: 16px; height: 16px; }
.results { border-radius: 4px; overflow: hidden; box-shadow: 0 0 0 1px var(--rule); }
.results button { display: flex; width: 100%; justify-content: space-between; align-items: center; padding: 9px 12px; font-size: 13px; background: #fff; box-shadow: inset 0 -1px 0 var(--ivory-2); }
.results button:hover, .results button.on { background: var(--teal-wash); }
.results button.on { font-weight: 700; }
.results small { color: var(--ink-3); font-weight: 400; }
.search { position: relative; }
.search svg { position: absolute; left: 11px; top: 11px; color: var(--ink-3); }
.search .inp { padding-left: 36px; }
.quiz { border-radius: 4px; background: var(--ink); color: var(--on-ink); padding: 18px; display: grid; gap: 8px; }
.quiz .q { font-size: 13px; color: var(--on-ink-2); }
.quiz .ans { font-size: 24px; font-weight: 900; }
.score { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; border-radius: 4px; overflow: hidden; }
.score div { background: var(--ivory); padding: 10px; text-align: center; font-size: 12px; color: var(--ink-3); display: grid; }
.score b { font-size: 20px; color: var(--ink); }
.qlist { display: grid; gap: 0; }
.ql { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; min-height: 38px; font-size: 14px; position: relative; }
.ql::before { content: ""; position: absolute; left: 10px; top: 0; bottom: 0; width: 2px; background: var(--brass); opacity: .5; }
.ql:first-child::before { top: 50%; } .ql:last-child::before { bottom: 50%; }
.ql i { position: relative; width: 16px; height: 16px; margin-left: 3px; border-radius: 50%; border: 2px dashed var(--brass); background: var(--paper); }

/* 대화상자 */
.scrim { position: fixed; inset: 0; background: rgba(20,35,45,.45); display: grid; place-items: center; padding: 16px; z-index: 50; }
.dlg { background: var(--paper); border-radius: 6px; width: min(460px, 100%); max-height: calc(100% - 32px); overflow: auto; box-shadow: 0 24px 60px rgba(20,35,45,.3); }
.dlg.wide { width: min(720px, 100%); }
.dlg-h { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 0; }
.dlg-h h2 { margin: 0; font-size: 18px; }
.dlg-b { padding: 16px 20px; display: grid; gap: 16px; }
.dlg-f { padding: 0 20px 18px; display: flex; justify-content: flex-end; gap: 8px; }
.kv { display: grid; grid-template-columns: 64px 1fr; gap: 8px 12px; font-size: 13px; margin: 0; }
.kv dt { color: var(--ink-3); font-weight: 500; } .kv dd { margin: 0; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; border-radius: 4px; background: var(--ivory); }
.switch .tg { width: 42px; height: 24px; border-radius: 12px; background: var(--ivory-3); position: relative; flex: none; }
.switch .tg::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch .tg.on { background: var(--teal); } .switch .tg.on::after { transform: translateX(18px); }
.radio { display: grid; gap: 6px; }
.radio label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 4px; background: var(--ivory); font-size: 13px; cursor: pointer; }
.radio label.on { background: var(--teal-wash); }
.radio input { accent-color: var(--teal); margin-top: 3px; }
.radio b { display: block; font-size: 14px; }
.exp { display: grid; grid-template-columns: 1fr 240px; gap: 18px; }
.sheet { background: #fff; border-radius: 3px; box-shadow: 0 0 0 1px var(--rule), 0 6px 16px rgba(20,35,45,.1); aspect-ratio: 1.414; padding: 10px; display: grid; grid-template-rows: auto 1fr auto; gap: 6px; }
.sheet.port { aspect-ratio: .707; }
.sheet .t { font-size: 10px; font-weight: 700; }
.sheet .m { position: relative; border-radius: 2px; overflow: hidden; background: var(--sea); }
.sheet .l { height: 16px; position: relative; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: var(--ink); color: var(--on-ink); border-radius: 4px; padding: 11px 16px; display: flex; align-items: center; gap: 14px; font-size: 13px; z-index: 60; box-shadow: 0 10px 24px rgba(20,35,45,.3); max-width: calc(100% - 32px); }
.toast button { color: var(--brass); font-weight: 700; display: inline-flex; gap: 4px; align-items: center; }

/* 홈: 관측실에 들어서는 첫 화면 */
.home { min-height: 100%; background: var(--ivory); }
.h-top { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 24px; padding: 18px var(--gut); }
.wm { display: flex; align-items: center; gap: 10px; }
.wm b { font-size: 18px; font-weight: 900; letter-spacing: -0.03em; display: block; line-height: 1.1; }
.wm span { font-size: 12px; color: var(--ink-3); display: block; }
.h-top nav { display: flex; gap: 22px; color: var(--ink-2); font-weight: 500; }
.h-top nav b { color: var(--ink); }
.h-top .sp { flex: 1; }
.hero { max-width: 1280px; margin: 0 auto; padding: 28px var(--gut) 72px; display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 56px; align-items: center; }
.hero h1 span { white-space: nowrap; }

.plate { background: var(--ink); border-radius: 6px; overflow: hidden; color: var(--on-ink); display: grid; grid-template-rows: minmax(320px, 1fr) auto auto; box-shadow: 0 30px 60px rgba(20,35,45,.22); }

.plate .pread .s b { color: #8FC2BC; }
.plate .pax { position: relative; height: 92px; padding: 0 18px; }
.plate .pax-in { position: relative; height: 100%; }
.pax .ln { position: absolute; left: 0; right: 0; top: 44px; height: 2px; background: var(--brass); }
.pax .tk { position: absolute; top: 38px; width: 1px; height: 14px; background: var(--brass); }

.sec { max-width: 1280px; margin: 0 auto; padding: 96px var(--gut) 0; }

.specimen { background: var(--paper); border-radius: 6px; padding: 28px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

.modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 24px; margin-top: 40px; }

.cta { background: var(--ink); color: var(--on-ink); margin-top: 110px; }
.cta-in { max-width: 1280px; margin: 0 auto; padding: 72px var(--gut); display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.cta h2 { margin: 0; font-size: clamp(28px, 3.2vw, 44px); letter-spacing: -0.04em; font-weight: 900; flex: 1; min-width: 280px; }
.foot { max-width: 1280px; margin: 0 auto; padding: 28px var(--gut) 90px; font-size: 12px; color: var(--ink-3); line-height: 1.7; }

@media (prefers-reduced-motion: reduce) { .save.saving svg { animation: none; } .mk, .box { transition: none; } }
@media (max-width: 1000px) {
  .ed { display: block; overflow-y: auto; }
  .ed-main { grid-template-rows: 52vh auto; min-height: auto; box-shadow: none; }
  .insp { overflow: visible; box-shadow: inset 0 1px 0 var(--rule); }
  .hero, .two, .exp { grid-template-columns: minmax(0, 1fr); }

  .strip { grid-template-columns: 1fr 1fr; }
}
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); }
  .rail { flex-direction: row; padding: 6px 10px; gap: 4px; }
  .rail .mark { margin: 0 8px 0 0; }
  .rail button.nav { width: auto; padding: 6px 10px; grid-auto-flow: column; gap: 6px; }
  .rail .me { margin: 0 0 0 auto; }
  .topbar { flex-wrap: wrap; height: auto; padding: 10px 12px; gap: 8px; }
  .topbar .sp { display: none; }
  .tb-actions .lbl { display: none; }
  .h-top nav { display: none; }
  .h-top { gap: 10px; }
  .h-top .try, .wm span span { display: none; }
  .wm b { white-space: nowrap; }
  .specimen { grid-template-columns: minmax(0, 1fr); }
  .specimen .title { grid-column: 1; }
  .plate .pread { grid-template-columns: minmax(0, 1fr); }
  .legend { display: none; }
  .announce .next { display: none; }
  .readout { display: none; }
}

/* ===== 개편 추가분: 기존 토큰·형태를 그대로 사용 ===== */

/* 지도 위 도구 */

.map-tools button.on { background: var(--ink); color: var(--on-ink); }
.map-search { position: absolute; right: 58px; top: 14px; width: min(300px, calc(100% - 90px)); z-index: 1100; }
.map-search form { position: relative; }

.map-area .zoom, .map-area .legend, .map-area .atlas-foot, .map-area .readout, .map-area .map-hint, .map-area .announce, .map-area .playbar, .map-area .map-empty { z-index: 1050; }
.map-area .map-hint { top: 64px; }

.map-note { position: absolute; left: 14px; bottom: 44px; z-index: 1050; background: rgba(251,249,244,.95); border-radius: 4px; padding: 6px 10px; font-size: 12px; color: var(--ink-2); max-width: calc(100% - 28px); box-shadow: 0 1px 2px rgba(20,35,45,.12); }
#mapmount, .mv { position: absolute; inset: 0; }

/* MapLibre 최소 스타일 (CDN CSS가 늦거나 막혀도 지도가 깨지지 않도록) */
.maplibregl-map { position: relative; overflow: hidden; font-family: var(--font); -webkit-tap-highlight-color: transparent; }

.maplibregl-marker { position: absolute; top: 0; left: 0; will-change: transform; }

.smap.darkened .maplibregl-canvas { filter: invert(1) hue-rotate(180deg) brightness(.82) contrast(.9) saturate(.6); }
.lp.small { width: 24px; height: 24px; }
.lp.small i { width: 13px; height: 13px; border-width: 3px; }
.lp.small.sel i { width: 16px; height: 16px; }
.lp.small .lbl { left: 22px; font-size: 11.5px; }
.lp.small.left .lbl { left: auto; right: 22px; }
.lp.small .cnt { display: none; }
.lp.dk i { background: #14232D; border-color: #7FB5AF; }

.lp-int { cursor: pointer; }
.lp-int:focus-visible { outline: none; }
.lp-int:focus-visible .lp i { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--brass); }

/* 핀 표식: 범례와 같은 형태 */

.lp.sel i { width: 21px; height: 21px; background: var(--ink); box-shadow: 0 0 0 7px rgba(84,140,136,.28); }

.lp .lbl { position: absolute; left: 31px; top: 50%; transform: translateY(-50%); white-space: nowrap; font-size: 12.5px; font-weight: 700; color: var(--ink); text-shadow: 0 0 3px var(--land), 0 0 3px var(--land), 0 0 3px var(--land), 0 0 2px var(--land); pointer-events: none; font-family: var(--font); }

.rt-arrow { width: 14px; height: 14px; color: var(--rc, var(--teal)); }
.rt-arrow svg { display: block; width: 14px; height: 14px; }

/* 오른쪽 패널: 목록 */
.tabs { display: flex; gap: 2px; box-shadow: inset 0 -1px 0 var(--rule); }
.tabs button { height: 36px; padding: 0 12px; font-size: 13px; font-weight: 700; color: var(--ink-3); box-shadow: inset 0 -2px 0 transparent; }
.tabs button.on { color: var(--ink); box-shadow: inset 0 -2px 0 var(--ink); }
.ilist { display: grid; gap: 4px; }
.irow { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 4px; background: var(--ivory); font-size: 13px; text-align: left; width: 100%; min-height: 40px; }

.irow.on small { color: var(--on-ink-2); }
.irow .t { flex: 1; min-width: 0; display: grid; }

.irow .t small { font-size: 11.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pdot { width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--pc, var(--teal)); background: var(--paper); flex: none; }
.rline { width: 22px; height: 4px; border-radius: 2px; background: var(--rc, var(--teal)); flex: none; }

.iconbtn { width: 32px; height: 32px; border-radius: 4px; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.iconbtn:hover { background: var(--ivory-3); color: var(--ink); }

.irow.on .iconbtn:hover { background: var(--ink-line); color: var(--on-ink); }
.swatches { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.swatches button { width: 30px; height: 30px; border-radius: 50%; background: var(--c); box-shadow: inset 0 0 0 2px rgba(255,255,255,.6); }

.swatches input[type=color] { width: 34px; height: 30px; border: 0; padding: 0; background: none; cursor: pointer; }
.ordlist { display: grid; gap: 4px; counter-reset: o; }
.ord { display: flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; border-radius: 4px; background: var(--ivory); font-size: 13px; }
.ord .n { width: 22px; height: 22px; border-radius: 50%; background: var(--brass); color: #fff; font-size: 11.5px; font-weight: 700; display: grid; place-items: center; flex: none; }
.ord span.t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
.ord .iconbtn { width: 30px; height: 30px; }
.pickgrid { display: flex; flex-wrap: wrap; gap: 6px; }
.pickgrid button { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px; border-radius: 16px; background: var(--ivory); font-size: 12.5px; font-weight: 500; }

.field small.hint { font-size: 12px; color: var(--ink-3); }
select.inp { padding-right: 8px; }
.date-row select.inp { width: auto; }
.inp.err { border-color: var(--danger); outline-color: var(--danger); }
.ferr { color: var(--danger); font-size: 12px; font-weight: 500; }
.photo-edit { display: grid; gap: 8px; }
.photo-big .frame.nat { aspect-ratio: auto; max-height: 260px; display: grid; place-items: center; background: var(--ivory-2); }
.photo-big .frame.nat img.ph { width: auto; max-width: 100%; height: auto; max-height: 260px; object-fit: contain; }
.mini-atlas { position: relative; height: 150px; border-radius: 4px; overflow: hidden; background: var(--sea); }

.relform { display: grid; grid-template-columns: 1fr auto; gap: 6px; }
.relform select { grid-column: 1 / 3; }
.mcard { display: none; }

/* 연표 화면 */

.tlA .tk { position: absolute; width: 1px; background: var(--brass); }
.tlA .mo { position: absolute; font-size: 11px; color: var(--brass-ink); transform: translateX(-50%); }
.tlA .gap { position: absolute; transform: translateX(-50%); font-size: 10.5px; color: var(--brass-ink); background: var(--paper); padding: 0 4px; white-space: nowrap; }
.tlA .mk { width: 18px; height: 18px; margin: -9px 0 0 -9px; }
.cardA { position: absolute; width: 220px; height: 248px; border-radius: 4px; background: var(--paper); box-shadow: 0 0 0 1px var(--rule); overflow: hidden; display: grid; grid-template-rows: 124px 1fr; text-align: left; z-index: 2; transition: box-shadow .15s; }

.cardA .tx { padding: 10px 12px; display: grid; gap: 3px; align-content: start; min-width: 0; }
.cardA .tx .d { font-size: 12px; font-weight: 700; color: var(--brass-ink); }
.cardA .tx b { font-size: 15px; line-height: 1.3; font-weight: 700; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cardA .tx p { margin: 0; font-size: 12.5px; color: var(--ink-2); line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.cardA.sel { background: var(--ink); color: var(--on-ink); box-shadow: none; }

.cardA.dim { opacity: .35; }

.tlA-nav .bar { flex: 1; height: 4px; background: var(--ivory-2); border-radius: 2px; position: relative; }
.tlA-nav .bar i { position: absolute; top: 0; height: 4px; background: var(--ink-3); border-radius: 2px; }
.round { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; background: var(--ivory-2); }
.round:hover { background: var(--ivory-3); }

/* ==========================================================
   이 기기 임시 저장: IndexedDB (작업 내용 + 사진 파일)
   - 작업 내용(JSON)은 'ws' 저장소, 사진은 압축한 Blob으로 'photos' 저장소에 둔다.
   - localStorage에는 사진을 넣지 않는다. 글자 데이터만 비상용으로 짧게 남긴다.
   ========================================================== */
const DB = {
  db: null, ok: false,
  open() {
    return new Promise(res => {
      try {
        const rq = indexedDB.open('sigonggan-lab', 1);
        rq.onupgradeneeded = () => { const d = rq.result; if (!d.objectStoreNames.contains('ws')) d.createObjectStore('ws'); if (!d.objectStoreNames.contains('photos')) d.createObjectStore('photos'); };
        rq.onsuccess = () => { this.db = rq.result; this.ok = true; res(true); };
        rq.onerror = () => res(false);
        rq.onblocked = () => res(false);
      } catch (e) { res(false); }
    });
  },
  tx(store, mode, fn) {
    return new Promise((res, rej) => {
      if (!this.db) return rej(new Error('no-db'));
      try {
        const t = this.db.transaction(store, mode), st = t.objectStore(store); let out;
        const r = fn(st); if (r) r.onsuccess = () => { out = r.result; };
        t.oncomplete = () => res(out); t.onerror = () => rej(t.error); t.onabort = () => rej(t.error || new Error('abort'));
      } catch (e) { rej(e); }
    });
  },
  get(store, key) { return this.tx(store, 'readonly', s => s.get(key)); },
  put(store, key, val) { return this.tx(store, 'readwrite', s => s.put(val, key)); },
  del(store, key) { return this.tx(store, 'readwrite', s => s.delete(key)); },
  keys(store) { return this.tx(store, 'readonly', s => s.getAllKeys()); }
};

/* ---------- 사진 ----------
   photo = { id, key?(예시 사진), path?(계정 스토리지 경로), caption, credit, w?, h? }
   - 기기에서 올린 사진: Blob을 IndexedDB 'photos'[id]에 보관
   - 계정 저장 시: 스토리지 <uid>/<id>.jpg 로 올리고 path를 기록 */
const PHOTO_MAX_BYTES = 25 * 1024 * 1024, PHOTO_MAX_SIDE = 1600, PHOTO_TARGET = 1.2 * 1024 * 1024;
const PHOTO_URL = new Map();   // id -> objectURL 또는 signed URL
const PHOTO_PENDING = new Set();
const BLANK = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
function photoSrc(p) {
  if (!p) return '';
  if (p.key && IMG[p.key]) return IMG[p.key].src;
  if (PHOTO_URL.has(p.id)) return PHOTO_URL.get(p.id);
  loadPhotoUrl(p);
  return '';
}
async function loadPhotoUrl(p) {
  if (PHOTO_PENDING.has(p.id)) return; PHOTO_PENDING.add(p.id);
  let url = '';
  try { const rec = DB.ok ? await DB.get('photos', p.id) : null; if (rec && rec.blob) url = URL.createObjectURL(rec.blob); } catch (e) {}
  if (!url && p.path && typeof Cloud !== 'undefined') { try { url = await Cloud.signedUrl(p.path); } catch (e) {} }
  PHOTO_PENDING.delete(p.id);
  if (url) { PHOTO_URL.set(p.id, url); document.querySelectorAll(`img[data-pid="${CSS.escape(p.id)}"]`).forEach(im => { im.src = url; }); }
  else document.querySelectorAll(`img[data-pid="${CSS.escape(p.id)}"]`).forEach(im => { im.alt = '사진을 불러오지 못했어요'; im.classList.add('broken'); });
}
function imgEl(p, alt = '', extra = '') {
  if (!p) return '';
  const src = photoSrc(p), user = !p.key;
  return `<img class="ph ${user ? 'user' : ''}" ${extra} data-pid="${esc(p.id)}" src="${esc(src || BLANK)}" alt="${esc(p.caption || alt || '첨부한 사진')}" ${p.key ? 'loading="lazy"' : ''} crossorigin="anonymous">`;
}
const creditOf = p => !p ? '' : [p.caption, p.credit || (p.key ? IMG[p.key]?.credit : '')].filter(Boolean).join(' · ') || '내가 올린 사진';

/* 큰 사진은 긴 변 1600px, 약 1.2MB 이하의 JPEG로 줄여서 보관한다 */
async function processImage(file) {
  if (!file) throw new Error('파일이 없어요.');
  if (!/^image\//.test(file.type) && !/\.(jpe?g|png|webp|gif|heic|heif)$/i.test(file.name || '')) throw new Error('사진 파일(JPG·PNG·WEBP)만 올릴 수 있어요.');
  if (file.size > PHOTO_MAX_BYTES) throw new Error(`사진이 너무 커요. ${Math.round(PHOTO_MAX_BYTES / 1048576)}MB 이하로 올려 주세요.`);
  let bmp;
  try {
    bmp = 'createImageBitmap' in window ? await createImageBitmap(file) : await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); });
  } catch (e) { throw new Error('이 사진 형식은 브라우저에서 열 수 없어요. JPG나 PNG로 바꿔서 올려 주세요.'); }
  const w0 = bmp.width, h0 = bmp.height; if (!w0 || !h0) throw new Error('사진을 읽지 못했어요.');
  const k = Math.min(1, PHOTO_MAX_SIDE / Math.max(w0, h0)), w = Math.round(w0 * k), h = Math.round(h0 * k);
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const cx = cv.getContext('2d'); cx.fillStyle = '#FBF9F4'; cx.fillRect(0, 0, w, h); cx.drawImage(bmp, 0, 0, w, h);
  if (bmp.close) bmp.close();
  let blob = null;
  for (const q of [0.86, 0.74, 0.62, 0.5]) {
    blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', q));
    if (blob && blob.size <= PHOTO_TARGET) break;
  }
  if (!blob) throw new Error('사진을 줄이는 중에 문제가 생겼어요.');
  return { blob, w, h, mime: 'image/jpeg', origBytes: file.size };
}
async function storePhoto(file, meta = {}) {
  const r = await processImage(file);
  const id = rid();
  if (!DB.ok) throw new Error('이 브라우저에서는 사진을 임시 저장할 수 없어요(사생활 보호 모드인지 확인해 주세요).');
  try { await DB.put('photos', id, { blob: r.blob, w: r.w, h: r.h, mime: r.mime, at: Date.now() }); }
  catch (e) { throw new Error(/quota/i.test(String(e && (e.name || e.message))) ? '기기 저장 공간이 부족해 사진을 보관하지 못했어요.' : '사진을 기기에 보관하지 못했어요.'); }
  PHOTO_URL.set(id, URL.createObjectURL(r.blob));
  return { id, caption: meta.caption || '', credit: meta.credit || '', w: r.w, h: r.h, kb: Math.round(r.blob.size / 1024), origKb: Math.round(r.origBytes / 1024) };
}
async function photoBlob(p) {
  if (!p) return null;
  if (DB.ok) { try { const rec = await DB.get('photos', p.id); if (rec && rec.blob) return rec.blob; } catch (e) {} }
  const url = p.key ? IMG[p.key]?.src : (p.path && typeof Cloud !== 'undefined' ? await Cloud.signedUrl(p.path) : PHOTO_URL.get(p.id));
  if (!url) return null;
  const r = await fetch(url); if (!r.ok) return null; return await r.blob();
}

/* ---------- 작업 공간 ----------
   지도와 연표는 서로 다른 탐구로 따로 저장된다. 연표 사건은 지도 핀을 pinId로 참조할 수 있고,
   연표만 따로 저장·공유해도 위치가 남도록 place(이름·좌표) 사본을 함께 가진다. */
const WS_VERSION = 2;
function emptyMap() { return { cloudId: null, ownerId: null, version: 0, title: '나의 지도', desc: '', pins: [], routes: [], updatedAt: nowISO(), dirty: false, cloudSavedAt: null }; }
function emptyTl() { return { cloudId: null, ownerId: null, version: 0, title: '나의 연표', desc: '', design: 'museum', events: [], rels: [], updatedAt: nowISO(), dirty: false, cloudSavedAt: null }; }
function emptyWS() { return { v: WS_VERSION, map: emptyMap(), tl: emptyTl() }; }
function normPhoto(p) { if (!p || typeof p !== 'object') return null; if (!p.id) p.id = p.key ? 'asset-' + p.key : rid(); p.caption = p.caption || ''; p.credit = p.credit || ''; return p; }
function normMapData(m) {
  const out = Object.assign(emptyMap(), m || {});
  out.pins = (out.pins || []).filter(p => p && Number.isFinite(+p.lat) && Number.isFinite(+p.lon)).map(p => ({ id: p.id || uid('p'), lat: +p.lat, lon: +p.lon, title: String(p.title || p.place || '이름 없는 핀'), place: String(p.place || ''), desc: String(p.desc || ''), date: p.date || null, photo: normPhoto(p.photo), src: String(p.src || ''), color: safeColor(p.color), left: !!p.left, createdAt: p.createdAt || nowISO(), updatedAt: p.updatedAt || nowISO() }));

  return out;
}
function normTlData(t) {
  const out = Object.assign(emptyTl(), t || {});

  out.events = (out.events || []).map((e, i) => ({ id: e.id || uid('e'), t: String(e.t || '제목 없는 사건'), d: e.d || { unknown: true }, desc: String(e.desc || ''), src: String(e.src || ''), memo: String(e.memo || ''), photo: normPhoto(e.photo), pinId: e.pinId || null, place: e.place && Number.isFinite(+e.place.lat) ? { name: String(e.place.name || ''), lat: +e.place.lat, lon: +e.place.lon } : null, ord: Number.isFinite(e.ord) ? e.ord : i, createdAt: e.createdAt || nowISO(), updatedAt: e.updatedAt || nowISO() }));

function migrateWS(raw) {

let WS = emptyWS();

  try { const t = localStorage.getItem(LS_BACKUP); if (t) fromLs = JSON.parse(t); } catch (e) {}
  // 새로고침 직전 IndexedDB 기록이 끝나지 못했을 때를 대비해, 더 최근 것을 고른다
  const stamp = w => w ? Math.max(Date.parse(w.map?.updatedAt || 0) || 0, Date.parse(w.tl?.updatedAt || 0) || 0) : -1;
  const pick = stamp(fromLs) > stamp(fromDb) ? fromLs : fromDb;

  try { localStorage.setItem(LS_BACKUP, JSON.stringify(WS)); ok = ok || true; } catch (e) { /* 용량 초과 등: IndexedDB가 성공했으면 괜찮다 */ }

/* ==========================================================

    else if (monthTicks && pp >= 120) { ticks += `<span class="ax-tick" style="left:${x}px;top:${top - 5}px;height:8px;opacity:.7"></span>`; if (pp >= 600 || m % 3 === 1) ticks += `<span class="ax-mo" style="left:${x}px;top:${top - 22}px">${m}</span>`; }
  }
  const lanes = [], pos = evs.map(e => { const x = X(tval(e.d)); let l = lanes.findIndex(r => x >= r + gap); if (l < 0) { lanes.push(0); l = lanes.length - 1; } lanes[l] = x + cardW; return { e, x, l }; });
  const H = top + 16 + lanes.length * laneH + 8;
  const playIdx = S.play != null ? pos.findIndex(p => p.e.id === all[S.play]?.id) : -1;
  let line = `<span class="ax-line" style="left:${padL - 20}px;width:${X(t1) - padL + 40}px;top:${top - 1}px"></span>`;
  if (S.play != null && playIdx >= 0) line = `<span class="ax-line dim" style="left:${padL - 20}px;width:${X(t1) - padL + 40}px;top:${top - 1}px"></span><span class="ax-line" style="left:${padL - 20}px;width:${pos[playIdx].x - padL + 20}px;top:${top - 1}px"></span>`;
  let rels = '';
  if (S.relations) {
    let paths = '', tags = '';
    tlL().rels.forEach(r => {
      const a = pos.find(p => p.e.id === r.f), b = pos.find(p => p.e.id === r.t); if (!a || !b) return;
      const h = Math.min(34, 14 + Math.abs(b.x - a.x) / 12), yb = top - 2, yt = yb - h;
      paths += `<path d="M${a.x} ${yb} C ${a.x} ${yt}, ${b.x} ${yt}, ${b.x - 2} ${yb - 3}" fill="none" stroke="#14232D" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ah)"/>`;
      tags += `<span class="rel-tag" style="left:${(a.x + b.x) / 2}px;top:${yt + h * 0.25}px">${esc(r.k)}</span>`;
    });
    rels = `<svg style="position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:3" width="${W}" height="${top}" aria-hidden="true"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#14232D"/></marker></defs>${paths}</svg>${tags}`;
  }
  const items = pos.map(({ e, x, l }, i) => {
    const isSel = e.id === selId, hl = hlIds.includes(e.id), dim = S.play != null && i > playIdx;
    const hidden = R && !R.revealed.includes(e.id), place = eventPlace(e);
    const y = top + 16 + l * laneH;
    return `<span class="leader ${isSel ? 'sel' : ''}" style="left:${x}px;top:${top}px;height:${y - top}px"></span>
      <button class="mk ${place ? '' : 'hollow'} ${isSel ? 'sel' : ''} ${dim ? 'dim' : ''}" style="left:${x}px;top:${top}px" data-act="ev-sel" data-id="${e.id}" aria-label="${hidden ? '가려진 사건' : esc(e.t)} ${fmtDate(e.d)}" tabindex="-1"></button>
      <button class="box ${isSel ? 'sel' : ''} ${hl ? 'hl' : ''} ${dim ? 'dim' : ''}" style="left:${x}px;top:${y}px" data-act="ev-sel" data-id="${e.id}">${e.photo ? `<span class="th">${imgEl(e.photo, e.t)}</span>` : ''}<span class="tx"><span>${fmtDate(e.d)}${place ? '' : ' · 장소 미지정'}</span><b>${hidden ? '<span class="redact" aria-label="가려진 사건"></span>' : esc(e.t)}</b></span></button>`;
  }).join('');
  const yr = d => d.bc ? '기원전 ' + d.y : d.y;
  return head(`${yr(evs[0].d)} – ${yr(evs[evs.length - 1].d)} · 사건 ${all.length}${unknown ? ` (날짜 미상 ${unknown})` : ''} · ${kx < 1 ? '긴 기간이라 줄여서 표시' : '눈금 1칸 = 1개월'} · 실제 간격`)
    + `<div class="axis-scroll" id="axscroll"><div class="axis-track" style="width:${W}px;height:${H}px">${ticks}${rels}${line}${items}</div></div>`;
}

}
function openDialog(name, data = {}) { S.dialog = name; S.dialogData = data; }

function setRoute(r, opts = {}) {
  if (!['home', 'map', 'timeline', 'library'].includes(r)) r = 'home';
  const changed = S.route !== r;
  S.dialog = null; S.play = null; S.review = null; S.mapMode = null; S.tempPin = null; S.draftRoute = null; S.errors = {};
  if (changed) {
    if (S.panel === 'pinForm' || S.panel === 'eventForm' || S.panel === 'route') S.draft = null;
    S.panel = r === 'map' ? (S.selPin ? 'pin' : S.selEvent ? 'event' : 'list') : (S.selEvent ? 'event' : 'none');

  if (!opts.fromHash && location.hash !== h) history.pushState(null, '', location.pathname + location.search + h);

          const kids = [...tmp.querySelector('.tlB-in').children];
          let group = [], count = 0;
          const flush = () => { if (!group.length) return; const d = add(`<div class="tlB" style="padding:0"><div class="tlB-in" style="max-width:none;margin:0"></div></div>`, { split: 'y' }); const box = d.querySelector('.tlB-in'); group.forEach(k => box.appendChild(k)); group = []; count = 0; };
          let lastYear = null;
          kids.forEach(k => {
            if (k.classList.contains('yr')) lastYear = k;
            if (k.dataset.xb === 'card') { if (count >= 6) { flush(); if (lastYear && !group.includes(lastYear)) { const c = lastYear.cloneNode(true); c.querySelector('span').textContent = '(이어서)'; group.push(c); } } count++; }
            group.push(k);
          });
          flush();
          if (S.relations) blocks.filter(b => b.split === 'y').forEach(b => drawRelsB(b.el));
        } else {
          const { track, unk } = museumView(true);
          const d = add(`<div class="tlA" style="height:auto"><div class="tlA-scroll" style="overflow:visible;padding:0">${track}</div></div>`, { split: 'x' });
          const tr = d.querySelector('.tlA-track'); if (tr) d.style.width = (parseFloat(tr.style.width) + 40) + 'px';
          if (unk) add(`<div class="tlA">${unk.replace('class="unknown-row"', 'class="unknown-row" style="padding:0"')}</div>`);
        }
      }
      if (o.sources) {
        const rows = [];
        if (wantMap) mapL().pins.forEach(p => { if (p.src) rows.push(`${esc(pinLabel(p))}: ${esc(p.src)}`); if (o.photos && p.photo && !p.photo.key && (p.photo.credit || p.photo.caption)) rows.push(`${esc(pinLabel(p))} 사진: ${esc(creditOf(p.photo))}`); });
        if (wantTl) sorted().forEach(e => { if (e.src) rows.push(`${esc(e.t)}: ${esc(e.src)}`); if (o.photos && e.photo) rows.push(`${esc(e.t)} 사진: ${esc(creditOf(e.photo))}`); });
        if (wantMap && mapL().pins.length) rows.push('지도 바탕: OpenFreeMap © OpenMapTiles · 지도 데이터 © OpenStreetMap 기여자');
        if (rows.length) add(`<div class="xsrc"><b style="font-size:14px">출처</b><ol>${[...new Set(rows)].map(r => `<li>${r}</li>`).join('')}</ol></div>`);
      }
      const style = document.createElement('style');
      style.textContent = `#xroot.x-nodesc .cardA .tx p, #xroot.x-nodesc .cardB .bodyB p { display:none } #xroot.x-nophoto .phB, #xroot.x-nophoto .cardB figcaption { display:none } #xroot.x-nophoto .cardB { grid-template-columns: minmax(0,1fr) } #xroot.x-nophoto .cardA .ph-f img { visibility:hidden } #xroot img.ph { filter: none } #xroot .cardA, #xroot .cardB { box-shadow: 0 0 0 1px var(--rule) }`;
      xr.appendChild(style);
      this.step('사진을 불러오는 중…', 50);
      await this.waitImages(xr);
      // 그리기
      const pieces = [];
      for (let i = 0; i < blocks.length; i++) {
        const b = blocks[i]; this.step(`그리는 중… ${i + 1}/${blocks.length}`, 50 + (i / blocks.length) * 40);
        const w = b.el.scrollWidth, h = b.el.scrollHeight;
        const sc = Math.min(2, 15000 / Math.max(w, h), Math.sqrt(120e6 / (w * h)));
        const cv = await window.html2canvas(b.el, { scale: sc, backgroundColor: '#FBF9F4', useCORS: true, logging: false, width: w, height: h, windowWidth: Math.max(w, refW) + 40 });
        const br = b.el.getBoundingClientRect(), cut = [];
        if (b.split === 'y') b.el.querySelectorAll('.tlB-in > *').forEach(k => { const r = k.getBoundingClientRect(); cut.push([r.top - br.top, r.bottom - br.top]); });
        if (b.split === 'x') b.el.querySelectorAll('.cardA, .yr, .rel-tag, .gap, .mo').forEach(k => { const r = k.getBoundingClientRect(); cut.push([r.left - br.left, r.right - br.left]); });
        pieces.push({ cv, w, h, sc, split: b.split, cut });
      }
      this.step('파일로 묶는 중…', 94);
      if (pdf) await this.toPdf(pieces, land, refW); else await this.toPng(pieces, refW);
      xr.innerHTML = '';
      S.exporting = { done: pdf ? `PDF를 만들었어요 (${this.fileName('pdf')}). 다운로드 폴더를 확인해 주세요.` : `PNG를 만들었어요 (${this.fileName('png')}). 다운로드 폴더를 확인해 주세요.` };
    } catch (e) {
      console.error(e);
      S.exporting = { error: '내보내는 중에 문제가 생겼어요: ' + String(e && e.message || e).slice(0, 140), offerMap: o.scope !== 'tl' && mapL().pins.length > 0 };
    }
    render();
  },
  /* 자를 수 있는 위치: 어떤 카드 구간 [a, b] 안에도 들지 않는 지점 중 limit 이하에서 가장 먼 곳 */
  safeCut(cut, start, limit, total) {
    if (limit >= total) return total;
    let best = -1;
    const inside = x => cut.some(([a, b]) => x > a + 0.5 && x < b - 0.5);
    for (let x = Math.floor(limit); x > start + 40; x -= 2) if (!inside(x)) { best = x; break; }
    return best > start ? best : limit;
  },
  slicesOf(p, maxAlong) {
    const total = p.split === 'x' ? p.w : p.h; const out = []; let s = 0;
    while (s < total - 1) { const e = this.safeCut(p.cut, s, s + maxAlong, total); out.push([s, e]); s = e; }
    return out;
  },
  crop(p, a, b) {
    const c = document.createElement('canvas');
    if (p.split === 'x') { c.width = Math.round((b - a) * p.sc); c.height = p.cv.height; c.getContext('2d').drawImage(p.cv, Math.round(a * p.sc), 0, c.width, c.height, 0, 0, c.width, c.height); return { cv: c, w: b - a, h: p.h }; }
    c.width = p.cv.width; c.height = Math.round((b - a) * p.sc); c.getContext('2d').drawImage(p.cv, 0, Math.round(a * p.sc), c.width, c.height, 0, 0, c.width, c.height); return { cv: c, w: p.w, h: b - a };
  },
  async toPdf(pieces, land, refW) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation: land ? 'landscape' : 'portrait', unit: 'mm', format: 'a4', compress: true });
    const PW = land ? 297 : 210, PH = land ? 210 : 297, M = 12, CW = PW - M * 2, CH = PH - M * 2, k = CW / refW;
    let y = M, first = true;
    const place = (cv, w, h) => {
      let ww = w * k, hh = h * k;
      if (ww > CW) { const f = CW / ww; ww *= f; hh *= f; }
      if (hh > CH) { const f = CH / hh; ww *= f; hh *= f; }
      if (y + hh > PH - M + 0.1 && !first) { doc.addPage(); y = M; }
      doc.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', M, y, ww, hh, undefined, 'FAST');
      y += hh + 3; first = false;
    };
    for (const p of pieces) {
      if (p.split === 'x') { for (const [a, b] of this.slicesOf(p, refW)) { const c = this.crop(p, a, b); place(c.cv, c.w, c.h); } }
      else if (p.split === 'y') {
        const room = (PH - M - y) / k, full = CH / k;
        let s = 0; const total = p.h;
        while (s < total - 1) { const lim = s === 0 && room > 120 ? room : full; const e = this.safeCut(p.cut, s, s + lim, total); const c = this.crop(p, s, e); place(c.cv, c.w, c.h); s = e; }
      } else place(p.cv, p.w, p.h);
    }
    doc.save(this.fileName('pdf'));
  },
  async toPng(pieces, refW) {
    const W = Math.max(...pieces.map(p => p.w)), H = pieces.reduce((a, p) => a + p.h + 8, 0);
    const sc = Math.min(2, 16000 / Math.max(W, H), Math.sqrt(200e6 / (W * H)));
    const c = document.createElement('canvas'); c.width = Math.round(W * sc); c.height = Math.round(H * sc);
    const cx = c.getContext('2d'); cx.fillStyle = '#FBF9F4'; cx.fillRect(0, 0, c.width, c.height);
    let y = 0; for (const p of pieces) { cx.drawImage(p.cv, 0, Math.round(y * sc), Math.round(p.w * sc), Math.round(p.h * sc)); y += p.h + 8; }
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    if (!blob) throw new Error('이미지가 너무 커서 만들지 못했어요. PDF로 내보내 주세요.');
    this.download(blob, this.fileName('png'));
  },
  /* 내보내기 도구 없이 지도만 PNG로 */
  async mapOnlyPng() {
    try {
      S.exporting = { busy: true, msg: '지도를 그리는 중…', pct: 20 }; render();
      const w = 1200, h = 760, head = 80, L0 = mapL();
      const { canvas } = await renderMapCanvas(w, h, 2);
      const c = document.createElement('canvas'); c.width = w * 2; c.height = (h + head) * 2; const cx = c.getContext('2d');
      cx.fillStyle = '#FBF9F4'; cx.fillRect(0, 0, c.width, c.height); cx.scale(2, 2);
      cx.fillStyle = '#14232D'; cx.font = '900 26px "Noto Sans KR",sans-serif'; cx.fillText(L0.title, 20, 40);
      cx.fillStyle = '#44535C'; cx.font = '500 13px "Noto Sans KR",sans-serif'; cx.fillText((L0.desc || '').slice(0, 90), 20, 64);
      cx.drawImage(canvas, 0, head, w, h);
      const blob = await new Promise(r => c.toBlob(r, 'image/png'));
      this.download(blob, `${(L0.title || '지도').replace(/[\\/:*?"<>|]+/g, '_')}.png`);
      S.exporting = { done: '지도 PNG를 만들었어요.' };
    } catch (e) { S.exporting = { error: '지도 이미지를 만들지 못했어요: ' + String(e && e.message || e).slice(0, 100) }; }
    render();
  }
};

init();
</script>
